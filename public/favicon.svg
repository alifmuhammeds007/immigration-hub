<svg
  viewBox="0 0 100 100"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    {/* The mask that cuts a clean sweeping arc through the letters */}
    <mask id="logo-slice-mask">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      {/* This arc is black to cut out of the elements */}
      <path
        d="M 5,60 C 28,52 52,40 85,32 L 85,39 C 52,47 28,59 5,67 Z"
        fill="black"
      />
    </mask>
  </defs>

  {/* Left Column "I" (Vibrant Red) */}
  <rect
    x="18"
    y="25"
    width="13"
    height="50"
    rx="1.5"
    fill="#E51937"
    mask="url(#logo-slice-mask)"
  />

  {/* Right Fused "H" (Corporate Navy / Dark Blue) */}
  <path
    d="M36,25 H49 V46 H61 V25 H74 V75 H61 V56 H49 V75 H36 Z"
    fill="#1B365D"
    mask="url(#logo-slice-mask)"
  />

